name: Weekly news update

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:       # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r updater/requirements.txt
      - name: Run updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python updater/update.py
      - name: Commit data changes
        run: |
          if git diff --quiet -- data; then
            echo "No changes this week."
            exit 0
          fi
          git config user.name "yard-map-bot"
          git config user.email "yard-map-bot@users.noreply.github.com"
          git add data
          git commit -m "Weekly data update $(date -u +%Y-%m-%d)"
          git push
