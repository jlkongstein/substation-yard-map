name: Weekly news scan

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:       # "Run workflow" button for manual runs

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan news feeds
        run: python updater/news_scan.py --report "$RUNNER_TEMP/report.md"
      - name: Commit data changes
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "yard-map-bot"
          git config user.email "yard-map-bot@users.noreply.github.com"
          git add data
          git commit -m "Weekly news scan $(date -u +%Y-%m-%d)"
          git push
      - name: Open weekly issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "^## " "$RUNNER_TEMP/report.md"; then
            gh issue create --title "News scan $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/report.md"
          else
            echo "Nothing to report this week."
          fi
