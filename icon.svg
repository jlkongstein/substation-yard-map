<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Offshore substation: topside module with crane on a jacket, standing in the sea. -->
  <rect width="64" height="64" rx="14" fill="#123352"/>
  <!-- sea -->
  <path d="M0 47c5 0 5-3 10.7-3s5.6 3 10.6 3 5.4-3 10.7-3 5.4 3 10.7 3 5.3-3 10.6-3S59 47 64 47v3H0z" fill="#5fb3f0"/>
  <path d="M0 50h64v0a14 14 0 0 1-14 14H14A14 14 0 0 1 0 50z" fill="#2e86d1"/>
  <!-- jacket legs -->
  <rect x="17" y="35" width="5" height="25" rx="1" fill="#b9c6d3"/>
  <rect x="42" y="35" width="5" height="25" rx="1" fill="#b9c6d3"/>
  <path d="M19.5 40 44.5 52M44.5 40 19.5 52" stroke="#b9c6d3" stroke-width="2"/>
  <!-- deck -->
  <rect x="9" y="31" width="46" height="5" rx="1.5" fill="#e3e9ef"/>
  <!-- topside module -->
  <rect x="13" y="14" width="25" height="17" rx="2" fill="#f4f7fa"/>
  <rect x="11" y="11.5" width="29" height="3.5" rx="1.2" fill="#9fb2c4"/>
  <!-- power symbol -->
  <path d="M27.5 16.5 20.5 24.5h5l-2 5.5 7.5-8.5h-5l1.5-4.5z" fill="#f5b301"/>
  <!-- crane -->
  <rect x="44" y="20" width="4" height="11" fill="#f5b301"/>
  <path d="M46 20 57 9" stroke="#f5b301" stroke-width="3" stroke-linecap="round"/>
  <path d="M57 9v9" stroke="#e3e9ef" stroke-width="1.5"/>
  <path d="M55.5 18h3l-1.5 2.5z" fill="#e3e9ef"/>
</svg>
